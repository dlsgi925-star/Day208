<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김하늘 마케팅 포트폴리오</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --line: #e6e9f0;
      --accent: #1a5cff;
      --soft: #f3f6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      word-break: keep-all;
    }

    /* 소개 */
    #intro {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px 40px;
      text-align: center;
    }
    #intro h1 { margin: 0 0 4px; font-size: 2.2rem; }
    #intro p { margin: 0; color: var(--muted); }
    #intro p + p {
      margin-top: 14px;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 700;
    }

    main { max-width: 720px; margin: 0 auto; padding: 0 20px 64px; }
    section { margin-bottom: 48px; }
    h2 {
      margin: 0 0 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--line);
      font-size: 1rem;
      letter-spacing: .08em;
      color: var(--muted);
    }

    /* 슬라이더 */
    #slider { display: flex; align-items: center; gap: 10px; }
    #slides { flex: 1; min-width: 0; }
    .slide {
      min-height: 240px;
      padding: 28px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--soft);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slide[hidden] { display: none; }
    .slide h3 { margin: 0 0 16px; font-size: 1.1rem; }
    .result { margin: 0; color: var(--muted); font-size: 1.05rem; }
    .result strong {
      display: inline-block;
      color: var(--accent);
      font-size: 2.6rem;
      line-height: 1.2;
      font-weight: 800;
    }
    #prev-btn, #next-btn {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(26, 92, 255, .12);
    }
    #prev-btn:disabled, #next-btn:disabled {
      color: #c3c8d4;
      box-shadow: none;
      cursor: default;
    }

    /* 도구 */
    #tools ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
    #tools li {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    /* 연락처 */
    #contact p { margin: 0; }
  </style>
</head>
<body>
  <header id="intro">
    <h1>김하늘</h1>
    <p>퍼포먼스 마케터 지망</p>
    <p>"숫자로 말하는 마케터"</p>
  </header>

  <main>
    <section id="projects">
      <h2>프로젝트</h2>

      <!-- 슬라이더: 2단계에서 한 번에 하나만 보이게 하고 화살표로 넘기게 연결 -->
      <div id="slider">
        <button type="button" id="prev-btn" aria-label="이전 프로젝트">←</button>

        <div id="slides">
          <article class="slide">
            <h3>동네 카페 인스타그램 3개월 운영</h3>
            <p class="result">팔로워 300명 → <strong>2,100명</strong></p>
          </article>

          <article class="slide">
            <h3>교내 축제 홍보</h3>
            <p class="result">사전 신청 <strong>1,200명</strong>, 목표 대비 <strong>150%</strong></p>
          </article>

          <article class="slide">
            <h3>온라인 쇼핑몰 광고 운영</h3>
            <p class="result">클릭률 1.2% → <strong>3.4%</strong></p>
          </article>
        </div>

        <button type="button" id="next-btn" aria-label="다음 프로젝트">→</button>
      </div>
    </section>

    <section id="tools">
      <h2>다룰 줄 아는 도구</h2>
      <ul>
        <li>GA4</li>
        <li>메타 광고</li>
        <li>캔바</li>
        <li>엑셀</li>
      </ul>
    </section>

    <section id="contact">
      <h2>연락처</h2>
      <p>이메일: haneul@example.com</p>
    </section>
  </main>

  <script>
    var slides = document.querySelectorAll('#slides .slide');
    var prevBtn = document.getElementById('prev-btn');
    var nextBtn = document.getElementById('next-btn');
    var current = 0;

    // 현재 프로젝트 하나만 보여주고, 처음/끝에서는 해당 화살표를 비활성화
    function showSlide(index) {
      current = index;
      slides.forEach(function (slide, i) {
        slide.hidden = i !== current;
      });
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === slides.length - 1;
    }

    prevBtn.addEventListener('click', function () { showSlide(current - 1); });
    nextBtn.addEventListener('click', function () { showSlide(current + 1); });

    // 처음에는 프로젝트 1을 보여줌
    showSlide(0);
  </script>
</body>
</html>
