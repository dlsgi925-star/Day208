<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김하늘 마케팅 포트폴리오</title>
</head>
<body>
  <header id="intro">
    <h1>김하늘</h1>
    <p>퍼포먼스 마케터 지망</p>
    <p>"숫자로 말하는 마케터"</p>
  </header>

  <main>
    <section id="projects">
      <h2>프로젝트</h2>

      <!-- 슬라이더: 2단계에서 한 번에 하나만 보이게 하고 화살표로 넘기게 연결 -->
      <div id="slider">
        <button type="button" id="prev-btn" aria-label="이전 프로젝트">←</button>

        <div id="slides">
          <article class="slide">
            <h3>동네 카페 인스타그램 3개월 운영</h3>
            <p class="result">팔로워 300명 → 2,100명</p>
          </article>

          <article class="slide">
            <h3>교내 축제 홍보</h3>
            <p class="result">사전 신청 1,200명, 목표 대비 150%</p>
          </article>

          <article class="slide">
            <h3>온라인 쇼핑몰 광고 운영</h3>
            <p class="result">클릭률 1.2% → 3.4%</p>
          </article>
        </div>

        <button type="button" id="next-btn" aria-label="다음 프로젝트">→</button>
      </div>
    </section>

    <section id="tools">
      <h2>다룰 줄 아는 도구</h2>
      <ul>
        <li>GA4</li>
        <li>메타 광고</li>
        <li>캔바</li>
        <li>엑셀</li>
      </ul>
    </section>

    <section id="contact">
      <h2>연락처</h2>
      <p>이메일: haneul@example.com</p>
    </section>
  </main>
</body>
</html>
